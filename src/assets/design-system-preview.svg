<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181322"/>
      <stop offset="100%" stop-color="#0f0c16"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ds-bg)"/>
  <rect x="24" y="24" width="752" height="452" rx="10" fill="#140f1d" stroke="#3d324c" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="752" height="44" rx="10" fill="#1c1628"/>
  <circle cx="50" cy="46" r="5" fill="#e2f752"/>
  <circle cx="68" cy="46" r="5" fill="#a48eb8"/>
  <circle cx="86" cy="46" r="5" fill="#4d3e5e"/>
  <text x="110" y="51" fill="#d6cee0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">DESIGN SYSTEM // EDITORIAL DESIGN TOKENS</text>

  <!-- Color Tokens Section -->
  <rect x="48" y="88" width="704" height="150" rx="8" fill="#1c1629" stroke="#3a2f4c" stroke-width="1"/>
  <text x="70" y="116" fill="#9b8ba9" font-family="monospace" font-size="11" letter-spacing="0.05em">PALETTE TOKENS</text>

  <!-- Swatch 1: Lavender -->
  <rect x="70" y="132" width="150" height="64" rx="6" fill="#d6cee0"/>
  <text x="80" y="214" fill="#f6f3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="600">--lavender</text>
  <text x="80" y="228" fill="#8d7c9e" font-family="monospace" font-size="10">#D6CEE0</text>

  <!-- Swatch 2: Acid -->
  <rect x="235" y="132" width="150" height="64" rx="6" fill="#e2f752"/>
  <text x="245" y="214" fill="#f6f3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="600">--acid</text>
  <text x="245" y="228" fill="#8d7c9e" font-family="monospace" font-size="10">#E2F752</text>

  <!-- Swatch 3: Ink -->
  <rect x="400" y="132" width="150" height="64" rx="6" fill="#1b1822" stroke="#4a3e5c" stroke-width="1"/>
  <text x="410" y="214" fill="#f6f3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="600">--ink</text>
  <text x="410" y="228" fill="#8d7c9e" font-family="monospace" font-size="10">#1B1822</text>

  <!-- Swatch 4: Paper -->
  <rect x="565" y="132" width="150" height="64" rx="6" fill="#f6f3ee"/>
  <text x="575" y="214" fill="#f6f3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="600">--paper</text>
  <text x="575" y="228" fill="#8d7c9e" font-family="monospace" font-size="10">#F6F3EE</text>

  <!-- Typography & Components -->
  <rect x="48" y="254" width="340" height="198" rx="8" fill="#1c1629" stroke="#3a2f4c" stroke-width="1"/>
  <text x="70" y="282" fill="#9b8ba9" font-family="monospace" font-size="11">TYPE SPECIMEN</text>
  <text x="70" y="328" fill="#f6f3ee" font-family="Georgia, serif" font-size="32" font-style="italic">Systems rigor.</text>
  <text x="70" y="364" fill="#d6cee0" font-family="system-ui, sans-serif" font-size="15">Human feeling.</text>
  <text x="70" y="420" fill="#7a6b8a" font-family="monospace" font-size="11">Display Serif / Sans / Monospace</text>

  <!-- Atoms & Stamps -->
  <rect x="412" y="254" width="340" height="198" rx="8" fill="#1c1629" stroke="#3a2f4c" stroke-width="1"/>
  <text x="434" y="282" fill="#9b8ba9" font-family="monospace" font-size="11">STAMPS &amp; SIGNATURES</text>

  <!-- Visitor Stamps preview -->
  <circle cx="460" cy="336" r="22" fill="#2d223f" stroke="#e2f752" stroke-width="1.5"/>
  <text x="460" y="344" fill="#e2f752" font-size="22" text-anchor="middle">✳</text>

  <circle cx="525" cy="336" r="22" fill="#2d223f" stroke="#d6cee0" stroke-width="1.5"/>
  <text x="525" y="344" fill="#d6cee0" font-size="22" text-anchor="middle">☻</text>

  <circle cx="590" cy="336" r="22" fill="#2d223f" stroke="#e2f752" stroke-width="1.5"/>
  <text x="590" y="344" fill="#e2f752" font-size="22" text-anchor="middle">♡</text>

  <circle cx="655" cy="336" r="22" fill="#2d223f" stroke="#d6cee0" stroke-width="1.5"/>
  <text x="655" y="344" fill="#d6cee0" font-size="22" text-anchor="middle">↗</text>

  <!-- Button Atom -->
  <rect x="434" y="390" width="130" height="34" rx="4" fill="#e2f752"/>
  <text x="499" y="412" fill="#1b1822" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Action Pill ↗</text>

  <rect x="580" y="390" width="140" height="34" rx="4" fill="transparent" stroke="#d6cee0" stroke-width="1"/>
  <text x="650" y="412" fill="#d6cee0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Secondary Atom</text>
</svg>
